version: '3.8'

services:
  chainscope:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chainscope-explorer
    ports:
      - "8008:8008"
    environment:
      - PORT=8008
      - CHAINSCOPE_DB=/app/backend/data/chainscope.db
    volumes:
      - explorer_data:/app/backend/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8008/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  explorer_data:
    driver: local
